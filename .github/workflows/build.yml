name: Build NexoraX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الضغط
        run: unzip -q NexoraX.zip

      - name: إصلاح اسم compose bom
        run: sed -i 's/name = "bom"/name = "compose-bom"/' NexoraX/gradle/libs.versions.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: بناء APK
        working-directory: NexoraX
        run: gradle assembleRelease --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoraX-apk
          path: NexoraX/app/build/outputs/apk/release/*.apk
